services:
  app1:
    image: docker.io/gustavopaes/rinha-backend-25:1.0.0
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "42MB"
    networks:
      - app-network

  app2:
    image: docker.io/gustavopaes/rinha-backend-25:1.0.0
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "42MB"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
